<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Friend ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple: #4b0082;
            --cherry: #d2143a;
            --white: #ffffff;
            --black: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-color: var(--black);
        }

        /* --- Animations --- */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* --- STAGE 1: BLACK ROOM --- */
        .stage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }

        #stage-bulb { z-index: 100; }
        
        .msg-pop {
            color: #9370db;
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-family: 'Dancing Script', cursive;
            animation: pulse 2s infinite;
        }

        .bulb {
            font-size: 80px;
            cursor: pointer;
            animation: floating 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px var(--purple));
        }

        /* --- STAGE 2: QUIZ (Purple/Cherry) --- */
        #stage-quiz {
            display: none;
            background: linear-gradient(135deg, #1a001a 0%, var(--purple) 50%, var(--cherry) 100%);
            opacity: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: white;
            width: 85%;
            max-width: 400px;
        }

        .opt-btn {
            background: rgba(210, 20, 58, 0.2);
            border: 2px solid var(--cherry);
            color: white;
            padding: 12px;
            margin: 8px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            animation: floating 4s ease-in-out infinite;
        }

        /* --- STAGE 3: LOADING (Black) --- */
        #stage-loading {
            display: none;
            background: var(--black);
            opacity: 0;
        }

        .loader-container {
            width: 250px;
            text-align: center;
        }

        .bar-bg {
            width: 100%;
            height: 12px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: var(--cherry);
            box-shadow: 0 0 15px var(--cherry);
        }

        /* --- ERROR MESSAGE --- */
        #error-msg {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--cherry);
            color: white; padding: 20px 40px;
            border-radius: 50px; font-weight: bold;
            display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="error-msg">itna bhi nahi pata 😂</div>

    <!-- Stage 1: The Bulb -->
    <div id="stage-bulb" class="stage">
        <div class="msg-pop">Want to light up?</div>
        <div class="bulb" onclick="toQuiz()">💡</div>
    </div>

    <!-- Stage 2: The Question -->
    <div id="stage-quiz" class="stage">
        <div class="card">
            <h2 style="font-family: 'Dancing Script'; font-size: 2.5rem;">What I call you? 😁</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr;">
                <button class="opt-btn" onclick="wrong()">Sudhi</button>
                <button class="opt-btn" onclick="wrong()">Sudhiksha</button>
                <button class="opt-btn" style="animation-delay: 0.5s;" onclick="toLoading()">Pagli 🎀</button>
                <button class="opt-btn" style="animation-delay: 1s;" onclick="wrong()">Devi ji 🙏</button>
            </div>
        </div>
    </div>

    <!-- Stage 3: Loading Screen -->
    <div id="stage-loading" class="stage">
        <div class="loader-container" id="loading-box">
            <h2 style="color: white; font-family: 'Dancing Script';">Wait a minute...</h2>
            <div class="bar-bg">
                <div class="bar-fill" id="bar"></div>
            </div>
        </div>

        <div id="excite-question" style="display: none; text-align: center; color: white;">
            <h2 style="font-family: 'Dancing Script'; font-size: 2.5rem;">Are u exited?</h2>
            <button class="opt-btn" style="width: 100px;" onclick="exciteResponse('yes')">Yes</button>
            <button class="opt-btn" style="width: 100px;" onclick="exciteResponse('no')">No</button>
            <p id="excite-msg" style="margin-top: 20px; font-weight: bold; color: #ff85a2;"></p>
        </div>
    </div>

    <!-- Sounds -->
    <audio id="magic-sound" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
    <audio id="buzzer-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <script>
        function playMagic() {
            document.getElementById('magic-sound').play();
        }

        function toQuiz() {
            playMagic();
            document.getElementById('stage-bulb').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('stage-bulb').style.display = 'none';
                const quiz = document.getElementById('stage-quiz');
                quiz.style.display = 'flex';
                setTimeout(() => quiz.style.opacity = '1', 50);
            }, 800);
        }

        function wrong() {
            document.getElementById('buzzer-sound').play();
            const err = document.getElementById('error-msg');
            err.style.display = 'block';
            setTimeout(() => err.style.display = 'none', 1500);
        }

        function toLoading() {
            playMagic();
            document.getElementById('stage-quiz').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('stage-quiz').style.display = 'none';
                const load = document.getElementById('stage-loading');
                load.style.display = 'flex';
                setTimeout(() => load.style.opacity = '1', 50);
                
                // Start Loading Bar
                let width = 0;
                const bar = document.getElementById('bar');
                const interval = setInterval(() => {
                    if (width >= 100) {
                        clearInterval(interval);
                        showExcite();
                    } else {
                        width++;
                        bar.style.width = width + '%';
                    }
                }, 50); // Speed of loading
            }, 800);
        }

        function showExcite() {
            document.getElementById('loading-box').style.display = 'none';
            document.getElementById('excite-question').style.display = 'block';
        }

        function exciteResponse(choice) {
            const msg = document.getElementById('excite-msg');
            if(choice === 'yes') {
                msg.innerText = "okay waiting is over! ✨";
                // Transition to Page 1 could go here next
            } else {
                msg.innerText = "i know u r exited don't tell lie 😁";
            }
        }
    </script>
</body>
</html>
