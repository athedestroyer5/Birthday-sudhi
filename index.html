<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple: #4b0082;
            --cherry: #d2143a;
            --light-purple: #9370db;
            --white: #ffffff;
            --dark-bg: #1a001a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        /* --- STAGE 1: DARK ROOM (Purple/Cherry Vibes) --- */
        #dark-room {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .msg-pop {
            color: var(--light-purple);
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            text-shadow: 0 0 10px var(--cherry);
            animation: pulse 2s infinite;
        }

        .bulb {
            font-size: 80px;
            cursor: pointer;
            filter: drop-shadow(0 0 5px var(--purple));
            transition: all 0.4s ease;
            user-select: none;
        }

        .bulb:hover {
            transform: scale(1.2) rotate(10deg);
            filter: drop-shadow(0 0 30px var(--cherry));
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* --- STAGE 2: MAIN CONTENT (Purple & Cherry Red Theme) --- */
        #main-content {
            display: none;
            height: 100vh;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #4b0082 50%, var(--cherry) 100%);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h2 {
            color: var(--white);
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .opt-btn {
            background: rgba(210, 20, 58, 0.2);
            border: 2px solid var(--cherry);
            color: white;
            padding: 15px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .opt-btn:hover {
            background: var(--cherry);
            box-shadow: 0 0 20px var(--cherry);
            transform: translateY(-5px);
        }

        /* --- ERROR POPUP (Now Centered) --- */
        #error-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--cherry);
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            white-space: nowrap;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <!-- Middle Error Message -->
    <div id="error-msg">itna bhi nahi pata 😂</div>

    <!-- Part 1: The Dark Room -->
    <div id="dark-room">
        <div class="msg-pop">Want to light up?</div>
        <div class="bulb" id="bulb-btn" onclick="lightUp()">💡</div>
    </div>

    <!-- Part 2: The Question Page -->
    <div id="main-content">
        <div class="card" id="question-card">
            <h2>What I call you? 😁</h2>
            <div class="options-grid">
                <button class="opt-btn" onclick="wrongAnswer(this)">Sudhi</button>
                <button class="opt-btn" onclick="wrongAnswer(this)">Sudhiksha</button>
                <button class="opt-btn" onclick="correctAnswer()">Pagli 🎀</button>
                <button class="opt-btn" onclick="wrongAnswer(this)">Devi ji 🙏</button>
            </div>
        </div>
    </div>

    <!-- Sound Effects -->
    <!-- Using a more stable URL for buzzer -->
    <audio id="error-audio" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <script>
        // Web Audio Context for a fallback "Buzzer" if the link fails
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBuzzer() {
            const errorSound = document.getElementById('error-audio');
            
            // Try playing the audio file first
            errorSound.play().catch(() => {
                // If blocked or link fails, generate a synthetic beep
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.value = 150;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            });
        }

        function lightUp() {
            // Transition effect
            document.getElementById('dark-room').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('dark-room').style.display = 'none';
                const main = document.getElementById('main-content');
                main.style.display = 'flex';
                setTimeout(() => {
                    main.style.opacity = '1';
                }, 50);
            }, 1000);
        }

        function wrongAnswer(btn) {
            playBuzzer();
            
            // Shake the card
            const card = document.getElementById('question-card');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 500);

            // Show centered error message
            const popup = document.getElementById('error-msg');
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 1500);
        }

        function correctAnswer() {
            // We can add a success sound here!
            alert("Perfect! Now move to the next level...");
            // Next stage logic goes here
        }
    </script>
</body>
</html>
