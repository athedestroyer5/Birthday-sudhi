<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Pagli 🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple: #2d0036;
            --cherry: #d2143a;
            --pink: #ff85a2;
            --soft-pink: #fff0f3;
            --vanilla: #fdf5e6;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Poppins', sans-serif; overflow: hidden; background: #000; }

        .stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: 0.8s ease; }

        /* --- STAGE 1 & 2: INTRO --- */
        #stage-bulb { display: flex; background: #000; color: white; }
        #stage-quiz { background: linear-gradient(135deg, var(--purple), var(--cherry)); color: white; }
        
        .bulb { font-size: 80px; cursor: pointer; animation: floating 3s infinite; }
        .opt-btn { background: rgba(255,255,255,0.1); border: 2px solid white; color: white; padding: 12px 25px; margin: 10px; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .opt-btn:hover { background: white; color: var(--cherry); }

        /* --- STAGE 4: THE CAKE (Pink & White) --- */
        #stage-cake { background: var(--soft-pink); color: #444; }
        
        .cake-area { position: relative; width: 300px; height: 300px; display: flex; justify-content: center; align-items: flex-end; }
        
        /* The Vanilla Cake */
        .cake { width: 200px; height: 120px; background: #fff9e6; border-radius: 20px 20px 0 0; position: relative; border-bottom: 10px solid #f3e5ab; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .cake::after { content: ''; position: absolute; top: 30px; left: 0; width: 100%; height: 20px; background: rgba(255, 133, 162, 0.3); }

        .candle { position: absolute; width: 12px; height: 45px; background: var(--pink); top: -45px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .flame { position: absolute; top: -15px; left: 2px; width: 10px; height: 15px; background: #ffa500; border-radius: 50% 50% 20% 50%; transform: rotate(-45deg); animation: flicker 0.1s infinite; }

        .dancing-cat { position: absolute; left: -100px; bottom: 0; width: 120px; }
        .talking-cat { position: absolute; right: -100px; bottom: 0; width: 100px; }

        /* --- UNIVERSE --- */
        #stage-universe { background: #050505; color: white; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle 2s infinite; }
        
        .actor { position: absolute; bottom: 10%; left: -50px; font-size: 50px; transition: all 3s ease; z-index: 10; }
        .big-star { position: absolute; font-size: 100px; bottom: -150px; left: 50%; transform: translateX(-50%); transition: all 3s ease; filter: drop-shadow(0 0 20px gold); }

        /* --- ERROR POPUP --- */
        #custom-error { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: white; color: var(--cherry); padding: 15px 30px; border-radius: 50px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.5s; z-index: 2000; border: 2px solid var(--pink); }

        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes flicker { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
        @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.2); opacity: 1; } }

        /* Wish Form Aesthetic */
        #wish-box { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 80%; max-width: 320px; }
        #wish-box input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--pink); margin-top: 15px; outline: none; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="custom-error">itna bhi nahi pata 😂 🌸</div>

    <!-- STAGE 1: BULB -->
    <div id="stage-bulb" class="stage">
        <p style="font-family: 'Dancing Script'; font-size: 2rem;">Want to light up?</p>
        <div class="bulb" onclick="nextStage('stage-quiz')">💡</div>
    </div>

    <!-- STAGE 2: QUIZ -->
    <div id="stage-quiz" class="stage">
        <h2 style="font-family: 'Dancing Script'; font-size: 2.5rem;">What I call you? 😁</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr;">
            <button class="opt-btn" onclick="showError()">Sudhi</button>
            <button class="opt-btn" onclick="showError()">Sudhiksha</button>
            <button class="opt-btn" onclick="nextStage('stage-loading')">Pagli 🎀</button>
            <button class="opt-btn" onclick="showError()">Devi ji 🙏</button>
        </div>
    </div>

    <!-- STAGE 3: LOADING -->
    <div id="stage-loading" class="stage" style="background: #000; color: white;">
        <h2 style="font-family: 'Dancing Script';">Wait a minute...</h2>
        <div style="width: 250px; height: 10px; background: #222; border-radius: 10px; overflow: hidden;">
            <div id="bar" style="width: 0%; height: 100%; background: var(--pink);"></div>
        </div>
        <div id="excite-box" style="display: none; margin-top: 30px;">
            <p>Are u excited?</p>
            <button class="opt-btn" onclick="handleExcite('yes')">Yes</button>
            <button class="opt-btn" onclick="handleExcite('no')">No</button>
        </div>
    </div>

    <!-- STAGE 4: RESPONSE -->
    <div id="stage-response" class="stage" style="background: #000; color: white;">
        <h1 id="response-text" style="font-family: 'Dancing Script'; font-size: 3rem;"></h1>
        <button class="opt-btn" onclick="nextStage('stage-cake')">Let's see Page 1! ✨</button>
    </div>

    <!-- STAGE 5: THE CAKE PAGE -->
    <div id="stage-cake" class="stage">
        <div class="cake-area">
            <!-- Dancing Cat -->
            <img src="https://media.tenor.com/J8Y8V0p16p0AAAAi/happy-cat-meme-happy-cat.gif" class="dancing-cat" style="transform: scaleX(-1);">
            
            <div style="z-index: 5; text-align: center;">
                <p style="font-weight: bold; color: var(--cherry); margin-bottom: 10px;">Blow & Cut the Cake!</p>
                <div class="cake" id="main-cake" onclick="eatCake()">
                    <div class="candle" id="c1" style="left: 40px;" onclick="blow(1, event)"><div class="flame"></div></div>
                    <div class="candle" id="c2" style="left: 95px;" onclick="blow(2, event)"><div class="flame"></div></div>
                    <div class="candle" id="c3" style="left: 150px;" onclick="blow(3, event)"><div class="flame"></div></div>
                </div>
            </div>

            <!-- Talking Cat -->
            <img src="https://media.tenor.com/7p40W19mZRAAAAAi/cat-meme.gif" class="talking-cat">
        </div>

        <!-- Wish Form (Inside Page 1) -->
        <div id="wish-modal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,133,162,0.4); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center;">
            <div id="wish-box">
                <img src="https://media.tenor.com/Zifm0_9p6Y8AAAAi/cat-meme.gif" width="100">
                <h3 style="margin: 0; color: var(--cherry);">First type your wish 😉</h3>
                <input type="text" id="wish-input" placeholder="What's your secret wish?">
                <button class="opt-btn" style="background: var(--pink); border: none; margin-top: 15px; width: 100%;" onclick="submitWish()">Send to the Stars ✨</button>
            </div>
        </div>
    </div>

    <!-- STAGE 6: UNIVERSE ANIMATION -->
    <div id="stage-universe" class="stage">
        <div id="stars"></div>
        <div id="man" class="actor">🚶‍♂️</div>
        <div id="gift" class="actor" style="display: none;">🎁</div>
        <div id="hero-star" class="big-star">⭐</div>
        <h2 id="uni-text" style="font-family: 'Dancing Script'; font-size: 2.5rem; position: absolute; top: 20%; width: 100%; opacity: 0;">Sending your wish to the universe...</h2>
    </div>

    <audio id="eat-sound" src="https://www.myinstants.com/media/sounds/crunch.mp3"></audio>

    <script>
        let candlesBlown = 0;

        function nextStage(id) {
            document.querySelectorAll('.stage').forEach(s => s.style.display = 'none');
            const target = document.getElementById(id);
            target.style.display = 'flex';
            if(id === 'stage-loading') startLoading();
        }

        function showError() {
            const err = document.getElementById('custom-error');
            err.style.top = '30px';
            setTimeout(() => err.style.top = '-100px', 2000);
        }

        function startLoading() {
            let w = 0;
            const interval = setInterval(() => {
                if(w >= 100) { clearInterval(interval); document.getElementById('excite-box').style.display = 'block'; }
                else { w++; document.getElementById('bar').style.width = w + '%'; }
            }, 30);
        }

        function handleExcite(choice) {
            const txt = document.getElementById('response-text');
            txt.innerText = choice === 'yes' ? "Okay waiting is over! 😉" : "I know u r excited don't tell lie 😁";
            nextStage('stage-response');
        }

        function blow(n, e) {
            e.stopPropagation();
            document.getElementById('c'+n).style.opacity = '0';
            candlesBlown++;
            if(candlesBlown === 3) {
                setTimeout(() => document.getElementById('wish-modal').style.display = 'flex', 600);
            }
        }

        function submitWish() {
            const wish = document.getElementById('wish-input').value;
            if(!wish) return;

            // Silent Email Send
            fetch("https://formspree.io/f/xoeaeqjp", {
                method: "POST",
                body: JSON.stringify({ wish: wish }),
                headers: { 'Accept': 'application/json' }
            });

            document.getElementById('wish-modal').style.display = 'none';
            runUniverse();
        }

        function runUniverse() {
            nextStage('stage-universe');
            // Create background stars
            const starCont = document.getElementById('stars');
            for(let i=0; i<100; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.width = s.style.height = Math.random()*3+'px';
                s.style.left = Math.random()*100+'vw';
                s.style.top = Math.random()*100+'vh';
                starCont.appendChild(s);
            }

            const man = document.getElementById('man');
            const gift = document.getElementById('gift');
            const heroStar = document.getElementById('hero-star');

            // 1. Man walks to center
            setTimeout(() => {
                man.style.left = "45%";
                setTimeout(() => {
                    // 2. Gift appears
                    gift.style.display = "block";
                    gift.style.left = "50%";
                    man.innerText = "🏃‍♂️";
                    setTimeout(() => {
                        // 3. Star rises
                        heroStar.style.bottom = "20%";
                        document.getElementById('uni-text').style.opacity = "1";
                        setTimeout(() => {
                            // 4. Man sits on star and flies away
                            man.style.bottom = "32%";
                            gift.style.bottom = "32%";
                            gift.style.left = "54%";
                            setTimeout(() => {
                                heroStar.style.bottom = "120%";
                                man.style.bottom = "132%";
                                gift.style.bottom = "132%";
                                setTimeout(() => {
                                    nextStage('stage-cake');
                                    document.getElementById('main-cake').style.cursor = "pointer";
                                }, 3000);
                            }, 1000);
                        }, 2000);
                    }, 1000);
                }, 2000);
            }, 100);
        }

        function eatCake() {
            if(candlesBlown < 3) return;
            document.getElementById('eat-sound').play();
            const cake = document.getElementById('main-cake');
            cake.style.transform = "scale(0.8) rotate(5deg)";
            setTimeout(() => {
                cake.style.opacity = "0.3";
                alert("Yummm! Best cake ever! Happy Birthday Pagli! 🎂🎀");
            }, 200);
        }
    </script>
</body>
</html>
